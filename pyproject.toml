[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "us-healthbench"
version = "1.0.0"
description = "A citation-grounded, multilingual benchmark for evaluating LLM systems on official U.S. public-health guidance."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "William Alston"},
]
keywords = [
    "benchmark",
    "public-health",
    "LLM",
    "evaluation",
    "multilingual",
    "health-informatics",
    "RAG",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.6",
    "pdfplumber>=0.10",
    "langdetect>=1.0",
    "tiktoken>=0.7",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "krippendorff>=0.6",
    "tqdm>=4.66",
    "rich>=13.7",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.30",
    "anthropic>=0.25",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/williamDalston/us-healthbench"
Documentation = "https://github.com/williamDalston/us-healthbench/tree/main/docs"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
